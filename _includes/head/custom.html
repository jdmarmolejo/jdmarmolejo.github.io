<!-- =====================================================================
     Home-style treatment for all content pages (Talks, Teaching,
     Portfolio, Blog, CV and every individual item page).
     Removes the author sidebar, centres the content, gives pages a large
     header, and turns list items into cards — matching the homepage.
     The homepage itself uses the `home` layout (no #main/.archive/.page/
     .sidebar), so none of these rules touch it.
     ===================================================================== -->
<style>
  /* ---------- decorative backdrop (content pages only) ----------
     #main exists on every page except the homepage, so these rules
     never touch the hero. A fixed layer keeps it cheap to scroll. */
  /* Applied site-wide so the homepage's lower sections share the same
     backdrop as every other page. The hero paints its own opaque
     background on top, so it keeps its dedicated treatment. */
  body {
    background-image:
      /* faint blueprint grid */
      linear-gradient(color-mix(in srgb, var(--global-text-color) 7%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--global-text-color) 7%, transparent) 1px, transparent 1px),
      /* brand glows */
      radial-gradient(1000px 620px at 86% -12%,
        color-mix(in srgb, var(--global-base-color) 26%, transparent), transparent 62%),
      radial-gradient(840px 540px at -14% 112%,
        color-mix(in srgb, var(--global-link-color) 22%, transparent), transparent 62%);
    background-size: 46px 46px, 46px 46px, auto, auto;
    background-repeat: repeat, repeat, no-repeat, no-repeat;
    background-attachment: fixed, fixed, fixed, fixed;
  }

  /* full-width, centred content (override the theme's sidebar grid) */
  .sidebar { display: none !important; }
  #main {
    position: relative;
    max-width: 880px !important;
    margin: 0 auto !important;
    padding: 3rem 1.25rem 4.5rem !important;
    float: none !important;
  }
  #main > .page,
  #main > .archive {
    float: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    clear: both;
  }

  /* large, home-style page header */
  .page__title,
  .archive > .page__title {
    font-size: clamp(1.9rem, 4.5vw, 3rem) !important;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.08;
    margin: 0 0 1.4rem 0 !important;
    padding-bottom: 0.7rem;
    border-bottom: 0;
    position: relative;
  }
  .page__title::after {
    content: "";
    display: block;
    width: 62px; height: 4px;
    margin-top: 0.8rem;
    border-radius: 2px;
    background: var(--global-base-color);
  }

  /* list items as cards */
  .list__item,
  .grid__item { margin-bottom: 1rem; }
  .archive__item {
    display: block;
    position: relative;
    border: 1px solid color-mix(in srgb, var(--global-text-color) 12%, transparent);
    background: color-mix(in srgb, var(--global-bg-color) 55%, transparent);
    -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  /* accent edge that lights up on hover */
  .archive__item::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--global-base-color);
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .archive__item:hover::before { opacity: 1; }
  .archive__item:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--global-base-color) 55%, transparent);
    box-shadow: 0 16px 34px -18px rgba(0, 0, 0, 0.6);
  }
  .archive__item-title {
    margin: 0 0 0.35rem 0 !important;
    font-size: 1.2rem;
    line-height: 1.3;
  }
  .archive__item-title a {
    color: var(--global-text-color) !important;
    text-decoration: none;
    transition: color 0.16s ease;
  }
  .archive__item-title a:hover { color: var(--global-base-color) !important; }
  .archive__item-title .fa-link { font-size: 0.7em; opacity: 0.5; }
  .archive__item .page__meta,
  .archive__item .page__date,
  .archive__item > p {
    font-size: 0.92rem;
    color: color-mix(in srgb, var(--global-text-color) 72%, transparent);
    margin: 0.25rem 0;
  }
  .archive__item-excerpt { margin-top: 0.5rem !important; }

  /* year headings in the blog archive */
  .archive__subtitle {
    margin: 2rem 0 0.5rem 0;
    padding-bottom: 0.3rem;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--global-base-color);
    border-bottom: 1px solid color-mix(in srgb, var(--global-text-color) 12%, transparent);
  }

  /* single-item prose: comfortable reading measure + tidy meta */
  .page__content { font-size: 1.02rem; line-height: 1.75; }
  .page__content h2 { margin-top: 1.8rem; }
  .page > header .page__meta,
  .page > header .page__date { opacity: 0.8; }

  @media (max-width: 600px) {
    #main { padding: 2rem 1rem 3rem !important; }
    .archive__item { padding: 1.1rem 1.15rem; }
  }

       /* ---------- decorative page-background animation
     (opt-in per page via `bg_scene:` front matter) ---------- */
  .bg-scene {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
  }
  @media (max-width: 640px) {
    .bg-scene { opacity: 0.4; }
  }
  /* ---------- 1. narrative text gets its own readable surface ---------- */
  .area-panel__sheet {
    background: color-mix(in srgb, var(--global-bg-color) 88%, transparent);
    -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
    border: 1px solid color-mix(in srgb, var(--global-text-color) 12%, transparent);
    border-left: 3px solid color-mix(in srgb, var(--global-base-color) 70%, transparent);
    border-radius: 12px;
    padding: 1.6rem 1.8rem;
    margin-bottom: 2rem;
  }
  .area-panel__sheet .area-panel__title { margin-top: 0; }
  /* keep prose to a comfortable measure (~70 characters) */
  .area-panel__sheet .area-panel__desc,
  .area-panel__sheet .area-panel__intro { max-width: 68ch; }
  .area-panel__intro p:last-child { margin-bottom: 0; }

  /* ---------- 2. section headings also need a surface ---------- */
  .area-panel__pubs-heading,
  .area-panel__cat-heading,
  .area-panel__empty {
    display: inline-block;
    background: color-mix(in srgb, var(--global-bg-color) 88%, transparent);
    -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
    border-radius: 8px;
    padding: 0.3em 0.7em;
  }
  .area-panel__pubs-heading { margin-top: 0; }
  .area-panel__cat-heading  { margin-top: 1.5em; }

  /* ---------- 3. darker publication cards ---------- */
  /* Scoped to research so Talks/Teaching keep the lighter, more
     see-through treatment. Drop the `.area-panel ` prefix on both
     selectors to darken cards site-wide instead. */
  .area-panel .archive__item {
    background: color-mix(in srgb, var(--global-bg-color) 88%, transparent);
    -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
    border-color: color-mix(in srgb, var(--global-text-color) 16%, transparent);
  }

  /* ---------- 4. dim the busiest backdrop ---------- */
  /* Turing fills every pixel with colour, unlike the line-based scenes,
     so it needs to sit further back to keep text crisp. */
  .bg-scene[data-scene="turing"] { opacity: 0.28; }
  @media (max-width: 640px) {
    .bg-scene[data-scene="turing"] { opacity: 0.20; }
  }
</style>

<!-- end custom head snippets -->
