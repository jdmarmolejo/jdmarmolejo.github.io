<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#112c47"/>
      <stop offset="100%" stop-color="#06121f"/>
    </radialGradient>

    <radialGradient id="cellFill" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffb0c4" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#ff6b8e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7a2440" stop-opacity="0.03"/>
    </radialGradient>

    <pattern id="bgDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.6" fill="#ffffff" opacity="0.06"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="szArrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M 8 1 L 2 4.5 L 8 8" fill="none" stroke="#7ce9d9" stroke-width="1.3"/>
    </marker>
    <marker id="szArrowR" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M 1 1 L 7 4.5 L 1 8" fill="none" stroke="#7ce9d9" stroke-width="1.3"/>
    </marker>
    <marker id="flowArr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M 0 1 L 7 4.5 L 0 8 Z" fill="#4dd6e0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#bgDots)"/>

  <!-- ============ GROWTH CURVE: size grows, resets at a division threshold ============ -->
  <!-- plot axes -->
  <g stroke="#7ce9d9" stroke-width="1.2" opacity="0.6" fill="none">
    <path d="M 96 60 L 96 196 L 720 196" marker-start="url(#flowArr)" marker-end="url(#flowArr)"/>
  </g>
  <text x="70" y="70" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#7ce9d9" opacity="0.85">size</text>
  <text x="712" y="216" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#7ce9d9" opacity="0.85">t</text>

  <!-- division threshold -->
  <line x1="96" y1="88" x2="720" y2="88" stroke="#f5e9d3" stroke-width="1" stroke-dasharray="4 5" opacity="0.5"/>
  <text x="600" y="82" font-family="'Courier New', monospace" font-size="11" fill="#f5e9d3" opacity="0.6" letter-spacing="1">division size</text>

  <!-- sawtooth growth trace (grow to threshold, halve, repeat) -->
  <path d="M 110 180 L 250 92 L 250 150 L 430 92 L 430 150 L 610 92 L 610 150 L 700 118"
        fill="none" stroke="#4dd6e0" stroke-width="2.3" filter="url(#softGlow)" stroke-linejoin="round"/>
  <g fill="#f5e9d3">
    <circle cx="250" cy="92" r="3"/>
    <circle cx="430" cy="92" r="3"/>
    <circle cx="610" cy="92" r="3"/>
  </g>

  <!-- ============ STAGE A: newborn cell ============ -->
  <g filter="url(#softGlow)">
    <circle cx="185" cy="300" r="32" fill="url(#cellFill)"/>
    <circle cx="185" cy="300" r="32" fill="none" stroke="#ff8fa8" stroke-width="2.2"/>
  </g>
  <circle cx="185" cy="300" r="24" fill="none" stroke="#ff6b8e" stroke-width="0.8" opacity="0.5"/>
  <circle cx="192" cy="294" r="9" fill="#c94565" fill-opacity="0.4" stroke="#ffb0c4" stroke-width="1.2"/>
  <!-- size caliper A -->
  <line x1="153" y1="352" x2="217" y2="352" stroke="#7ce9d9" stroke-width="1.2" marker-start="url(#szArrow)" marker-end="url(#szArrowR)"/>
  <line x1="153" y1="346" x2="153" y2="358" stroke="#7ce9d9" stroke-width="1"/>
  <line x1="217" y1="346" x2="217" y2="358" stroke="#7ce9d9" stroke-width="1"/>

  <!-- ============ STAGE B: grown cell ============ -->
  <g filter="url(#softGlow)">
    <circle cx="400" cy="292" r="56" fill="url(#cellFill)"/>
    <circle cx="400" cy="292" r="56" fill="none" stroke="#ff8fa8" stroke-width="2.4"/>
  </g>
  <circle cx="400" cy="292" r="45" fill="none" stroke="#ff6b8e" stroke-width="0.8" opacity="0.5"/>
  <circle cx="410" cy="282" r="15" fill="#c94565" fill-opacity="0.4" stroke="#ffb0c4" stroke-width="1.4"/>
  <path d="M 402 278 Q 414 272 424 282" stroke="#ffb0c4" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- size caliper B (wider = bigger) -->
  <line x1="344" y1="360" x2="456" y2="360" stroke="#7ce9d9" stroke-width="1.2" marker-start="url(#szArrow)" marker-end="url(#szArrowR)"/>
  <line x1="344" y1="354" x2="344" y2="366" stroke="#7ce9d9" stroke-width="1"/>
  <line x1="456" y1="354" x2="456" y2="366" stroke="#7ce9d9" stroke-width="1"/>

  <!-- ============ STAGE C: division into two daughters ============ -->
  <g filter="url(#softGlow)">
    <circle cx="600" cy="300" r="33" fill="url(#cellFill)"/>
    <circle cx="668" cy="300" r="33" fill="url(#cellFill)"/>
    <circle cx="600" cy="300" r="33" fill="none" stroke="#ff8fa8" stroke-width="2.2"/>
    <circle cx="668" cy="300" r="33" fill="none" stroke="#ff8fa8" stroke-width="2.2"/>
  </g>
  <circle cx="606" cy="294" r="9" fill="#c94565" fill-opacity="0.4" stroke="#ffb0c4" stroke-width="1.2"/>
  <circle cx="662" cy="294" r="9" fill="#c94565" fill-opacity="0.4" stroke="#ffb0c4" stroke-width="1.2"/>
  <!-- cleavage furrow -->
  <path d="M 634 270 Q 628 300 634 330" stroke="#ffb0c4" stroke-width="1" fill="none" opacity="0.55" stroke-dasharray="2 3"/>

  <!-- ============ PROGRESSION ARROWS ============ -->
  <g stroke="#4dd6e0" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M 233 300 C 258 292, 288 292, 320 296" marker-end="url(#flowArr)"/>
    <path d="M 470 300 C 505 300, 528 300, 548 300" marker-end="url(#flowArr)"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="11" fill="#7ce9d9" opacity="0.7" text-anchor="middle">
    <text x="278" y="278">grow</text>
    <text x="512" y="284">divide</text>
  </g>

  <!-- Caption -->
  <text x="400" y="480" font-family="'Courier New', monospace" font-size="11" fill="#7ce9d9" opacity="0.55" text-anchor="middle" letter-spacing="3">S I Z E   C O N T R O L</text>
</svg>
