<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#112c47"/>
      <stop offset="100%" stop-color="#06121f"/>
    </radialGradient>

    <radialGradient id="bioFill" cx="65%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffb0c4" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#ff6b8e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7a2440" stop-opacity="0.05"/>
    </radialGradient>

    <radialGradient id="techFill" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#7ce9d9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d2238" stop-opacity="0"/>
    </radialGradient>

    <pattern id="bgDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.6" fill="#ffffff" opacity="0.06"/>
    </pattern>

    <pattern id="circuitGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 0 11 L 22 11 M 11 0 L 11 22" stroke="#4dd6e0" stroke-width="0.3" opacity="0.18"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cell radius 220, centered at (400, 250) -->
    <clipPath id="leftHalfV2">
      <path d="M 400 30 A 220 220 0 0 0 400 470 L 400 30 Z"/>
    </clipPath>

    <clipPath id="rightHalfV2">
      <path d="M 400 30 A 220 220 0 0 1 400 470 L 400 30 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#bgDots)"/>

  <!-- ============== LEFT HALF: TECH ============== -->
  <g clip-path="url(#leftHalfV2)">
    <circle cx="400" cy="250" r="220" fill="#08182a"/>
    <circle cx="400" cy="250" r="220" fill="url(#circuitGrid)"/>
    <circle cx="400" cy="250" r="220" fill="url(#techFill)"/>
    <circle cx="400" cy="250" r="220" fill="none" stroke="#4dd6e0" stroke-width="2.4"/>
    <circle cx="400" cy="250" r="211" fill="none" stroke="#7ce9d9" stroke-width="1" opacity="0.7"/>

    <!-- Solder pads on left rim -->
    <g fill="none" stroke="#7ce9d9" stroke-width="1.2">
      <rect x="178" y="247.5" width="5" height="5"/>
      <rect x="183" y="212" width="5" height="5"/>
      <rect x="195" y="178" width="5" height="5"/>
      <rect x="213" y="148" width="5" height="5"/>
      <rect x="237" y="121" width="5" height="5"/>
      <rect x="266" y="100" width="5" height="5"/>
      <rect x="298" y="84" width="5" height="5"/>
      <rect x="333" y="74" width="5" height="5"/>
      <rect x="368" y="69" width="5" height="5"/>
      <rect x="183" y="283" width="5" height="5"/>
      <rect x="195" y="317" width="5" height="5"/>
      <rect x="213" y="347" width="5" height="5"/>
      <rect x="237" y="374" width="5" height="5"/>
      <rect x="266" y="395" width="5" height="5"/>
      <rect x="298" y="411" width="5" height="5"/>
      <rect x="333" y="421" width="5" height="5"/>
      <rect x="368" y="426" width="5" height="5"/>
    </g>

    <!-- Nucleus = larger microchip on left side of seam -->
    <g transform="translate(400, 250)" filter="url(#softGlow)">
      <rect x="-72" y="-40" width="74" height="80" fill="#0a1a2c" stroke="#4dd6e0" stroke-width="2"/>
      <!-- Top pins -->
      <g stroke="#4dd6e0" stroke-width="1.3">
        <line x1="-64" y1="-40" x2="-64" y2="-48"/>
        <line x1="-52" y1="-40" x2="-52" y2="-48"/>
        <line x1="-40" y1="-40" x2="-40" y2="-48"/>
        <line x1="-28" y1="-40" x2="-28" y2="-48"/>
        <line x1="-16" y1="-40" x2="-16" y2="-48"/>
        <line x1="-64" y1="40" x2="-64" y2="48"/>
        <line x1="-52" y1="40" x2="-52" y2="48"/>
        <line x1="-40" y1="40" x2="-40" y2="48"/>
        <line x1="-28" y1="40" x2="-28" y2="48"/>
        <line x1="-16" y1="40" x2="-16" y2="48"/>
        <line x1="-72" y1="-30" x2="-80" y2="-30"/>
        <line x1="-72" y1="-18" x2="-80" y2="-18"/>
        <line x1="-72" y1="-6" x2="-80" y2="-6"/>
        <line x1="-72" y1="6" x2="-80" y2="6"/>
        <line x1="-72" y1="18" x2="-80" y2="18"/>
        <line x1="-72" y1="30" x2="-80" y2="30"/>
      </g>
      <!-- Notch -->
      <circle cx="-63" cy="-30" r="2.2" fill="none" stroke="#7ce9d9" stroke-width="0.9"/>
      <!-- Chip label -->
      <text x="-37" y="2" font-family="'Courier New', monospace" font-size="13" fill="#7ce9d9" text-anchor="middle" font-weight="bold">GENOME</text>
      <text x="-37" y="18" font-family="'Courier New', monospace" font-size="7" fill="#7ce9d9" text-anchor="middle" opacity="0.7">CORE-V4</text>
      <!-- internal trace detail -->
      <path d="M -64 -22 L -50 -22 L -50 -12 L -10 -12" stroke="#4dd6e0" stroke-width="0.7" fill="none" opacity="0.55"/>
      <path d="M -60 25 L -30 25 L -30 30 L -10 30" stroke="#4dd6e0" stroke-width="0.7" fill="none" opacity="0.55"/>
    </g>

    <!-- Capacitor analogs (mitochondria) -->
    <g transform="translate(280, 145)">
      <rect x="-22" y="-12" width="44" height="24" fill="#0d2238" stroke="#4dd6e0" stroke-width="1.5"/>
      <line x1="-15" y1="-12" x2="-15" y2="12" stroke="#4dd6e0" stroke-width="1"/>
      <line x1="-9" y1="-12" x2="-9" y2="12" stroke="#4dd6e0" stroke-width="1"/>
      <line x1="-3" y1="-12" x2="-3" y2="12" stroke="#4dd6e0" stroke-width="1"/>
      <line x1="3" y1="-12" x2="3" y2="12" stroke="#4dd6e0" stroke-width="1"/>
      <line x1="9" y1="-12" x2="9" y2="12" stroke="#4dd6e0" stroke-width="1"/>
      <line x1="15" y1="-12" x2="15" y2="12" stroke="#4dd6e0" stroke-width="1"/>
      <line x1="-22" y1="0" x2="-30" y2="0" stroke="#4dd6e0" stroke-width="1.3"/>
      <line x1="22" y1="0" x2="30" y2="0" stroke="#4dd6e0" stroke-width="1.3"/>
    </g>

    <!-- IC chips array (ribosome analogs) -->
    <g>
      <rect x="245" y="220" width="18" height="8" rx="0.5" fill="#4dd6e0"/>
      <rect x="270" y="245" width="18" height="8" rx="0.5" fill="#4dd6e0"/>
      <rect x="240" y="285" width="18" height="8" rx="0.5" fill="#4dd6e0"/>
      <rect x="265" y="320" width="18" height="8" rx="0.5" fill="#4dd6e0"/>
      <rect x="295" y="370" width="18" height="8" rx="0.5" fill="#4dd6e0"/>
      <rect x="250" y="370" width="18" height="8" rx="0.5" fill="#4dd6e0"/>
    </g>
    <!-- IC pins -->
    <g stroke="#4dd6e0" stroke-width="0.6">
      <line x1="249" y1="220" x2="249" y2="217"/>
      <line x1="254" y1="220" x2="254" y2="217"/>
      <line x1="259" y1="220" x2="259" y2="217"/>
      <line x1="249" y1="228" x2="249" y2="231"/>
      <line x1="254" y1="228" x2="254" y2="231"/>
      <line x1="259" y1="228" x2="259" y2="231"/>
    </g>

    <!-- Long meander bus -->
    <path d="M 230 175 L 260 175 L 260 195 L 240 195 L 240 210 L 320 210"
          fill="none" stroke="#4dd6e0" stroke-width="1.5" opacity="0.85"/>
    <g fill="#7ce9d9">
      <circle cx="260" cy="175" r="2"/>
      <circle cx="260" cy="195" r="2"/>
      <circle cx="240" cy="195" r="2"/>
      <circle cx="240" cy="210" r="2"/>
    </g>

    <!-- Connection traces -->
    <g stroke="#4dd6e0" stroke-width="0.7" opacity="0.55" fill="none">
      <path d="M 320 220 L 290 220 L 290 224 L 263 224"/>
      <path d="M 320 240 L 295 240 L 295 249 L 270 249"/>
      <path d="M 320 280 L 270 280 L 270 289 L 258 289"/>
      <path d="M 320 320 L 295 320 L 295 324 L 283 324"/>
      <path d="M 320 365 L 305 365 L 305 374 L 283 374"/>
    </g>

    <!-- Resistor symbol -->
    <g transform="translate(310, 405)" stroke="#4dd6e0" stroke-width="1.3" fill="none">
      <line x1="-22" y1="0" x2="-15" y2="0"/>
      <path d="M -15 0 L -12 -5 L -6 5 L 0 -5 L 6 5 L 12 -5 L 15 0"/>
      <line x1="15" y1="0" x2="22" y2="0"/>
    </g>
  </g>

  <!-- ============== RIGHT HALF: BIOLOGY ============== -->
  <g clip-path="url(#rightHalfV2)">
    <circle cx="400" cy="250" r="220" fill="url(#bioFill)"/>
    <circle cx="400" cy="250" r="220" fill="none" stroke="#ff8fa8" stroke-width="2.4"/>
    <circle cx="400" cy="250" r="211" fill="none" stroke="#ff6b8e" stroke-width="1" opacity="0.7"/>

    <!-- Phospholipid heads on right rim -->
    <g fill="#ffb0c4">
      <circle cx="620" cy="250" r="2.3"/>
      <circle cx="617" cy="214.5" r="2.3"/>
      <circle cx="605" cy="180.5" r="2.3"/>
      <circle cx="587" cy="150.5" r="2.3"/>
      <circle cx="563" cy="123.5" r="2.3"/>
      <circle cx="534" cy="102.5" r="2.3"/>
      <circle cx="502" cy="86.5" r="2.3"/>
      <circle cx="467" cy="76.5" r="2.3"/>
      <circle cx="432" cy="71.5" r="2.3"/>
      <circle cx="617" cy="285.5" r="2.3"/>
      <circle cx="605" cy="319.5" r="2.3"/>
      <circle cx="587" cy="349.5" r="2.3"/>
      <circle cx="563" cy="376.5" r="2.3"/>
      <circle cx="534" cy="397.5" r="2.3"/>
      <circle cx="502" cy="413.5" r="2.3"/>
      <circle cx="467" cy="423.5" r="2.3"/>
      <circle cx="432" cy="428.5" r="2.3"/>
    </g>

    <!-- Nucleus right half (mirrored, behind the chip — overlap is intentional, signaling continuity) -->
    <circle cx="400" cy="250" r="78" fill="#c94565" fill-opacity="0.4"/>
    <circle cx="400" cy="250" r="78" fill="none" stroke="#ffb0c4" stroke-width="1.7"/>
    <!-- Chromatin -->
    <path d="M 410 220 Q 430 210 446 226 Q 456 238 448 252" stroke="#ffb0c4" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 414 270 Q 434 286 458 270" stroke="#ffb0c4" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 416 248 Q 432 256 456 250" stroke="#ffb0c4" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.78"/>
    <path d="M 412 295 Q 432 304 460 290" stroke="#ffb0c4" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.65"/>
    <!-- Nucleolus -->
    <circle cx="438" cy="240" r="9" fill="#9c2f4d" opacity="0.55"/>

    <!-- Mitochondria -->
    <g transform="translate(518, 145)">
      <ellipse cx="0" cy="0" rx="38" ry="17" fill="#ff5e7e" fill-opacity="0.45" stroke="#ffb0c4" stroke-width="1.5"/>
      <line x1="-28" y1="-3" x2="-28" y2="3" stroke="#ffb0c4" stroke-width="1"/>
      <line x1="-19" y1="-8" x2="-19" y2="8" stroke="#ffb0c4" stroke-width="1"/>
      <line x1="-10" y1="-11" x2="-10" y2="11" stroke="#ffb0c4" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffb0c4" stroke-width="1"/>
      <line x1="10" y1="-11" x2="10" y2="11" stroke="#ffb0c4" stroke-width="1"/>
      <line x1="19" y1="-8" x2="19" y2="8" stroke="#ffb0c4" stroke-width="1"/>
      <line x1="28" y1="-3" x2="28" y2="3" stroke="#ffb0c4" stroke-width="1"/>
    </g>

    <!-- Smaller mitochondrion -->
    <g transform="translate(550, 380) rotate(-25)">
      <ellipse cx="0" cy="0" rx="26" ry="11" fill="#ff5e7e" fill-opacity="0.4" stroke="#ffb0c4" stroke-width="1.3"/>
      <line x1="-18" y1="-2" x2="-18" y2="2" stroke="#ffb0c4" stroke-width="0.9"/>
      <line x1="-10" y1="-5" x2="-10" y2="5" stroke="#ffb0c4" stroke-width="0.9"/>
      <line x1="-2" y1="-7" x2="-2" y2="7" stroke="#ffb0c4" stroke-width="0.9"/>
      <line x1="6" y1="-7" x2="6" y2="7" stroke="#ffb0c4" stroke-width="0.9"/>
      <line x1="14" y1="-5" x2="14" y2="5" stroke="#ffb0c4" stroke-width="0.9"/>
    </g>

    <!-- Rough ER -->
    <path d="M 488 320 Q 510 312 530 320 Q 550 326 575 320 Q 595 316 600 326 Q 590 344 568 340 Q 540 336 520 344 Q 498 350 488 340 Z"
          fill="#ff8fa8" fill-opacity="0.18" stroke="#ffb0c4" stroke-width="1.5" opacity="0.9"/>
    <circle cx="503" cy="319" r="2.2" fill="#ffb0c4"/>
    <circle cx="525" cy="321" r="2.2" fill="#ffb0c4"/>
    <circle cx="552" cy="319" r="2.2" fill="#ffb0c4"/>
    <circle cx="578" cy="320" r="2.2" fill="#ffb0c4"/>
    <circle cx="515" cy="342" r="2.2" fill="#ffb0c4"/>
    <circle cx="548" cy="342" r="2.2" fill="#ffb0c4"/>

    <!-- Free ribosomes -->
    <circle cx="500" cy="200" r="2.3" fill="#ffb0c4" opacity="0.85"/>
    <circle cx="555" cy="218" r="2.3" fill="#ffb0c4" opacity="0.85"/>
    <circle cx="465" cy="190" r="2.3" fill="#ffb0c4" opacity="0.85"/>
    <circle cx="478" cy="280" r="2.3" fill="#ffb0c4" opacity="0.85"/>
    <circle cx="600" cy="245" r="2.3" fill="#ffb0c4" opacity="0.85"/>
    <circle cx="478" cy="385" r="2.3" fill="#ffb0c4" opacity="0.85"/>
    <circle cx="488" cy="408" r="2.3" fill="#ffb0c4" opacity="0.85"/>
  </g>

  <!-- ============== CENTER SEAM ============== -->
  <line x1="400" y1="28" x2="400" y2="472" stroke="#f5e9d3" stroke-width="0.6" opacity="0.3" stroke-dasharray="2 3"/>

  <!-- Bits flowing across the seam -->
  <g font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#f5e9d3" text-anchor="middle">
    <text x="408" y="80" opacity="0.85">1</text>
    <text x="392" y="115" opacity="0.85">0</text>
    <text x="408" y="150" opacity="0.85">1</text>
    <text x="392" y="185" opacity="0.85">0</text>
    <text x="408" y="320" opacity="0.85">1</text>
    <text x="392" y="355" opacity="0.85">1</text>
    <text x="408" y="390" opacity="0.85">0</text>
    <text x="392" y="425" opacity="0.85">1</text>
  </g>
</svg>
